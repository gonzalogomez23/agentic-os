<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Onboarding Gym</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Registro de Membresía</h1>
    <p class="subtitle">Completa tus datos para comenzar tu experiencia en el gimnasio.</p>

    <form id="onboarding-form" novalidate>
      <div class="field">
        <label for="nombre">Nombre completo <span class="required">*</span></label>
        <input type="text" id="nombre" name="nombre" required autocomplete="name" placeholder="Juan Pérez">
      </div>

      <div class="field">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="juan@ejemplo.com">
      </div>

      <div class="field">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="+34 612 345 678">
      </div>

      <div class="field">
        <label for="fecha_nacimiento">Fecha de nacimiento <span class="required">*</span></label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
      </div>

      <div class="field">
        <label for="membresia">Tipo de membresía <span class="required">*</span></label>
        <select id="membresia" name="membresia" required>
          <option value="">Selecciona una opción</option>
          <option value="Mensual">Mensual</option>
          <option value="Trimestral">Trimestral</option>
          <option value="Anual">Anual</option>
        </select>
      </div>

      <div class="field">
        <label for="objetivo">Objetivo principal <span class="required">*</span></label>
        <select id="objetivo" name="objetivo" required>
          <option value="">Selecciona una opción</option>
          <option value="Perder peso">Perder peso</option>
          <option value="Ganar músculo">Ganar músculo</option>
          <option value="Recomposición corporal">Recomposición corporal</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <button type="submit" id="submit-btn">Enviar registro</button>
    </form>

    <div id="message" class="message" hidden></div>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
